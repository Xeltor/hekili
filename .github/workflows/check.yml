# `make check` on every push and pull request, minus the type check: LuaLS reads the WoW API annotations from a local
# absolute path (.luarc.json) that the runner does not have, so `make typecheck` stays a local step.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - run: make bootstrap
      - run: make lint
      - run: make fmt-check
      - name: Record fork Warrior fixtures
        run: |
          ARMS_RECS=record .lua/bin/busted tests/Forever/arms_recs_spec.lua
          TIMING=record .lua/bin/busted --filter='Fury.*follows wowsims' tests/Forever/wowsims_warrior_spec.lua
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warrior-regression-fixtures
          retention-days: 1
          path: |
            tests/Forever/fixtures/arms_recs_seeds1-3.lua
            tests/Forever/fixtures/timing_warrior_fury.lua
      - run: make syntax
      - run: make api-check
      - run: make packs-check
      - run: make tools-test
      - run: make wiki-check
