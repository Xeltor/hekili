name: merge fixtures

on:
  workflow_dispatch:
    inputs:
      trace_only:
        type: boolean
        default: false
      baseline_only:
        type: boolean
        default: false
      record_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  baseline:
    if: ${{ inputs.baseline_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0de8a77c2f5c124ec05b0017c7c9faec2eac78b
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - run: make bootstrap
      - run: .lua/bin/busted tests/Forever/loop_warrior_fury24_spec.lua tests/Forever/loop_warrior_fury_spec.lua
  trace:
    if: ${{ inputs.trace_only && !inputs.baseline_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: [fork, upstream, no_predicate, no_reckless]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - run: make bootstrap
      - if: matrix.kit == 'upstream' || matrix.kit == 'no_reckless'
        run: git show ad298381a:src/Hekili_Warrior/Warrior.lua > src/Hekili_Warrior/Warrior.lua
      - if: matrix.kit == 'no_predicate'
        run: sed -i '/usable = hasMeleeWeapon,/d' src/Hekili_Warrior/Warrior.lua
      - if: matrix.kit == 'no_reckless'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/Hekili_Warrior/Warrior.lua')
          s = p.read_text()
          s = re.sub(r'        reckless_mainhand = \{.*?        \},\n', '', s, count=1, flags=re.S)
          s = re.sub(r'        reckless_offhand = \{.*?        \},\n', '', s, count=1, flags=re.S)
          s = re.sub(r'spec:RegisterReaction\("reckless_swings", \{.*?\n\}\)\n', '', s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - run: REPLAY_TRACE=1 TIMING=record .lua/bin/busted --filter='Fury.*follows' tests/Forever/wowsims_warrior_spec.lua
  loops:
    if: ${{ !inputs.trace_only && !inputs.baseline_only && !inputs.record_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [loop, party, druid, rogue, paladin, shaman, hunter, mage, priest, warlock]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - run: make bootstrap
      - run: BUSTED_JOBS=1 make test-${{ matrix.tag }}
  record:
    if: ${{ !inputs.trace_only && !inputs.baseline_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - run: make bootstrap
      - run: ARMS_RECS=record .lua/bin/busted tests/Forever/arms_recs_spec.lua
      - run: TIMING=record .lua/bin/busted tests/Forever/wowsims_warrior_spec.lua
      - if: always()
        run: .lua/bin/busted tests/Forever/driver_alloc_spec.lua tests/Forever/wowsims_warlock_spec.lua
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-fixtures
          path: |
            tests/Forever/fixtures/arms_recs_seeds1-3.lua
            tests/Forever/fixtures/timing_warrior_*.lua
